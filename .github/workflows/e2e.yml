name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image (fonts, Chromium) as used to create the screenshot baselines.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Run E2E tests (desktop + mobile)
        run: npm run test:e2e

      - name: Upload report with screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
